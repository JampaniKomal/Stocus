<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stocus Settings</title>
  <link rel="stylesheet" href="options.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>Stocus Settings</h1>
      <p class="subtitle">Configure your allowed domains during focus mode.</p>
    </header>

    <main>
      <section class="card">
        <h2>Allowed Sites (Whitelist)</h2>
        <p class="help-text">During a focus session, <strong>ALL</strong> websites will be blocked except the ones listed below.</p>
        
        <div class="input-group">
          <input type="text" id="domainInput" placeholder="e.g. coursera.org, github.com">
          <button id="addBtn" class="btn btn-primary">Add Site</button>
        </div>

        <ul id="domainList" class="domain-list">
          <!-- Populated by JS -->
        </ul>
      </section>
    </main>
  </div>
  <script src="options.js"></script>
</body>
</html>
